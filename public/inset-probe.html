<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inset probe (temporary, R19)</title>
<style>
  /* A temporary probe for slot R19: what the browser reports for the viewport and the safe-area insets while scrolling.
     Three bottom bars side by side, each 44px of cells, so a screenshot shows which strategy keeps still. */
  html, body { margin: 0; background: #14181d; color: #e8e6df; font: 13px/1.4 ui-monospace, Consolas, monospace; }
  body { min-height: 3200px; }
  #log { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 10; background: rgba(20,24,29,.96); border-bottom: 1px solid #444; padding: 8px 10px; white-space: pre-wrap; max-height: 62vh; overflow: auto; }
  .marker { position: absolute; left: 10px; color: #8a8e95; }
  .bar { position: fixed; z-index: 10; height: 44px; display: flex; align-items: center; justify-content: center; font-weight: 600; letter-spacing: .08em; }
  /* A: the site's current form, the max reserve as padding, the bar sliding by (live − max). */
  #a { left: 0; width: 33.33%; background: #1f8a4c; color: #fff; padding-bottom: env(safe-area-max-inset-bottom, env(safe-area-inset-bottom, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) - env(safe-area-max-inset-bottom, env(safe-area-inset-bottom, 0px))); box-sizing: content-box; }
  /* B: the max reserve as padding, bottom 0 (the first fold). */
  #b { left: 33.33%; width: 33.33%; background: #2457b8; color: #fff; padding-bottom: env(safe-area-max-inset-bottom, env(safe-area-inset-bottom, 0px)); bottom: 0; box-sizing: content-box; }
  /* C: the live inset as padding, bottom 0 (the site before R19). */
  #c { left: 66.66%; width: 33.34%; background: #c0392b; color: #fff; padding-bottom: env(safe-area-inset-bottom, 0px); bottom: 0; box-sizing: content-box; }
  /* Probe elements: their computed padding tells the env() values. */
  .p { position: absolute; visibility: hidden; width: 0; height: 0; }
  #pl { padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  #pm { padding: env(safe-area-max-inset-top, -1px) env(safe-area-max-inset-right, -1px) env(safe-area-max-inset-bottom, -1px) env(safe-area-max-inset-left, -1px); }
</style>
</head>
<body>
<div id="log">loading…</div>
<div id="pl" class="p"></div><div id="pm" class="p"></div>
<div class="marker" style="top:900px">900px</div>
<div class="marker" style="top:1800px">1800px</div>
<div class="marker" style="top:2700px">2700px</div>
<div id="a" class="bar">A slide</div>
<div id="b" class="bar">B max</div>
<div id="c" class="bar">C live</div>
<script>
(function () {
  var log = document.getElementById('log');
  var pl = document.getElementById('pl'), pm = document.getElementById('pm');
  var t0 = performance.now();
  var lines = [];
  var last = '';
  function px(v) { return Math.round(parseFloat(v) || 0); }
  function insets(el) {
    var s = getComputedStyle(el);
    return [px(s.paddingTop), px(s.paddingRight), px(s.paddingBottom), px(s.paddingLeft)].join('/');
  }
  function state(reason) {
    var vv = window.visualViewport;
    var a = document.getElementById('a').getBoundingClientRect();
    var b = document.getElementById('b').getBoundingClientRect();
    var c = document.getElementById('c').getBoundingClientRect();
    var s = 'innerH=' + window.innerHeight + ' outerH=' + window.outerHeight + ' screenH=' + screen.height + ' availH=' + screen.availHeight +
      (vv ? ' vvH=' + Math.round(vv.height) + ' vvTop=' + Math.round(vv.offsetTop) + ' vvScale=' + vv.scale.toFixed(2) : '') +
      ' live(t/r/b/l)=' + insets(pl) + ' max=' + insets(pm) +
      ' cellsBottomFromViewport A=' + Math.round(window.innerHeight - (a.top + 44)) + ' B=' + Math.round(window.innerHeight - (b.top + 44)) + ' C=' + Math.round(window.innerHeight - (c.top + 44));
    if (s === last) return;
    last = s;
    lines.push(((performance.now() - t0) / 1000).toFixed(1) + 's ' + reason + ' scrollY=' + Math.round(window.scrollY) + ' ' + s);
    if (lines.length > 14) lines.shift();
    render();
  }
  function render() {
    log.textContent = 'inset probe · ' + new Date().toISOString().slice(11, 19) + 'Z\n' +
      'UA ' + navigator.userAgent + '\n' +
      'display-mode standalone=' + matchMedia('(display-mode: standalone)').matches + ' · dpr=' + devicePixelRatio + ' · env support max=' + (insets(pm) !== '-1/-1/-1/-1') + '\n' +
      'Bars: A slide (site now) · B max padding, bottom 0 · C live padding, bottom 0. The number after each is the cells’ bottom edge above the viewport’s bottom.\n\n' + lines.join('\n');
  }
  var raf = 0;
  function onScroll() { if (raf) return; raf = requestAnimationFrame(function () { raf = 0; state('scroll'); }); }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', function () { state('resize'); });
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', function () { state('vv-resize'); });
    visualViewport.addEventListener('scroll', function () { state('vv-scroll'); });
  }
  state('load');
  setInterval(function () { state('tick'); }, 1000);
})();
</script>
</body>
</html>
