<title>Paddock Designer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>
  :root {
    --bg: #0b0c0e; --panel: #121417; --panel-2: #191c20; --panel-3: #20242a;
    --line: #24282e; --line-2: #363c44;
    --ink: #eceae5; --ink-2: #99a1aa; --ink-3: #666d75;
    --amber: #f5a524; --rosso: #e2483d;
    --edit: #3b9dff; --edit-dim: #12385e; --ok: #4ea86b; --warn: #e0a532;
    --drop: #d9a400; --drop-bg: rgba(217,164,0,.16);
    --desk: #0f1013; --stage: #1c1d21;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f5f2; --panel: #ffffff; --panel-2: #efede8; --panel-3: #e6e3dc; --line: #dedad1; --line-2: #b7b2a6;
      --ink: #14161a; --ink-2: #575e66; --ink-3: #878e96; --amber: #9a6205; --rosso: #b8342a;
      --edit: #1668c4; --edit-dim: #cfe2f8; --ok: #2c7a4d; --warn: #9a6205; --drop: #b58600; --drop-bg: rgba(181,134,0,.16); --desk: #e9e7e1; --stage: #d9d6cf;
    }
  }
  :root[data-theme="light"] {
    --bg: #f6f5f2; --panel: #ffffff; --panel-2: #efede8; --panel-3: #e6e3dc; --line: #dedad1; --line-2: #b7b2a6;
    --ink: #14161a; --ink-2: #575e66; --ink-3: #878e96; --amber: #9a6205; --rosso: #b8342a;
    --edit: #1668c4; --edit-dim: #cfe2f8; --ok: #2c7a4d; --warn: #9a6205; --drop: #b58600; --drop-bg: rgba(181,134,0,.16); --desk: #e9e7e1; --stage: #d9d6cf;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--desk); color: var(--ink); font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow: hidden; }
  button { font-family: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--edit); outline-offset: 1px; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .cap { font-family: "IBM Plex Mono", monospace; font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); }
  .spacer { flex: 1; }
  .kbd { display: inline-block; border: 1px solid var(--line-2); border-bottom-width: 2px; padding: 0 5px; font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--ink-2); line-height: 16px; }

  /* ================= shell ================= */
  .app { display: grid; grid-template-rows: 40px minmax(0, 1fr); height: 100vh; }
  .apxhead { display: flex; align-items: center; gap: 4px; padding: 0 10px 0 14px; background: var(--panel); border-bottom: 1px solid var(--line-2); }
  .apxlogo { font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; margin-right: 18px; white-space: nowrap; }
  .apxlogo .dot { color: var(--amber); }
  .apxlogo b { font-weight: 400; color: var(--ink-2); }
  .wsb { border: 0; background: none; color: var(--ink-2); cursor: pointer; padding: 0 12px; height: 40px; font-size: 12px; font-weight: 500; position: relative; white-space: nowrap; }
  .wsb:hover { color: var(--ink); }
  .wsb.sel { color: var(--ink); box-shadow: inset 0 -2px 0 var(--amber); }
  .apxuser { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--ink-3); letter-spacing: .04em; white-space: nowrap; }
  .ib { border: 1px solid transparent; background: none; color: var(--ink-2); cursor: pointer; width: 30px; height: 30px; display: inline-grid; place-items: center; font-size: 13px; }
  .ib:hover:not(:disabled) { color: var(--ink); border-color: var(--line-2); background: var(--panel-2); }
  .ib:disabled { opacity: .35; cursor: default; }
  .ib.on { color: var(--edit); border-color: var(--edit-dim); background: var(--edit-dim); }
  .ws { min-height: 0; min-width: 0; display: flex; flex-direction: column; }
  .crumbs { display: flex; align-items: center; gap: 8px; padding: 0 14px; height: 30px; font-size: 11px; color: var(--ink-3); border-bottom: 1px solid var(--line); background: var(--panel-2); }
  .crumbs b { color: var(--ink-2); font-weight: 500; }
  .crumbs .sep { color: var(--ink-3); }

  /* ================= buttons ================= */
  .tb { border: 1px solid var(--line-2); background: none; color: var(--ink-2); cursor: pointer; font-size: 12px; padding: 5px 10px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; height: 30px; }
  .tb:hover:not(:disabled) { color: var(--ink); border-color: var(--ink-2); }
  .tb:disabled { opacity: .4; cursor: default; }
  .tb.primary { border-color: var(--edit); color: var(--edit); }
  .tb.primary:hover { background: var(--edit-dim); }
  .tb.run { background: var(--edit); color: #fff; border-color: var(--edit); }
  .tb.run:hover { filter: brightness(1.1); }
  .tb.danger:hover { color: var(--rosso); border-color: var(--rosso); }
  .tb kbd { font-family: "IBM Plex Mono", monospace; color: var(--ink-3); font-size: 10px; }
  .tb .car { color: var(--ink-3); font-size: 10px; }
  .pbtn { border: 1px solid var(--line-2); background: none; color: var(--ink-2); cursor: pointer; font-family: "IBM Plex Mono", monospace; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; padding: 6px 9px; }
  .pbtn:hover:not(:disabled) { color: var(--ink); border-color: var(--ink-2); }
  .pbtn:disabled { opacity: .35; cursor: default; }
  .pbtn.danger:hover { color: var(--rosso); border-color: var(--rosso); }
  .pbtn.primary { border-color: var(--edit); color: var(--edit); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .schip { border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); cursor: pointer; font-family: "IBM Plex Mono", monospace; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; padding: 5px 8px; }
  .schip:hover:not(:disabled) { border-color: var(--edit); color: var(--edit); }
  .schip.sel { border-color: var(--edit); background: var(--edit-dim); color: var(--ink); }
  .schip:disabled { opacity: .35; cursor: default; }
  .pill { font-family: "IBM Plex Mono", monospace; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; border: 1px solid var(--line-2); padding: 3px 7px; color: var(--ink-3); white-space: nowrap; }
  .pill.ok { border-color: var(--ok); color: var(--ok); }
  .pill.warn { border-color: var(--warn); color: var(--warn); }
  .pill.bad { border-color: var(--rosso); color: var(--rosso); }
  .pill.edit { border-color: var(--edit); color: var(--edit); }
  .badge { font-family: "IBM Plex Mono", monospace; font-size: 9px; border: 1px solid var(--line-2); padding: 0 5px; margin-left: 6px; color: var(--ink-3); border-radius: 8px; }
  .badge.has { border-color: var(--warn); color: var(--warn); }
  .badge.err { border-color: var(--rosso); color: var(--rosso); }

  /* ================= menus / toasts / context ================= */
  .menu { position: fixed; z-index: 60; min-width: 220px; background: var(--panel); border: 1px solid var(--line-2); box-shadow: 0 14px 40px rgba(0,0,0,.5); padding: 4px 0; }
  .menu button, .menu .mh { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; text-align: left; padding: 7px 14px; font-size: 12px; color: var(--ink); cursor: pointer; }
  .menu button:hover:not(:disabled) { background: var(--edit-dim); }
  .menu button:disabled { opacity: .4; cursor: default; }
  .menu button .k { margin-left: auto; font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--ink-3); }
  .menu button .chk { width: 14px; color: var(--edit); font-size: 11px; }
  .menu .mh { font-family: "IBM Plex Mono", monospace; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); padding: 8px 14px 4px; cursor: default; }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  .menu .msub { font-size: 11px; color: var(--ink-3); margin-left: auto; }
  .toasts { position: fixed; left: 50%; bottom: 52px; transform: translateX(-50%); z-index: 70; display: grid; gap: 6px; pointer-events: none; }
  .toast { background: var(--ink); color: var(--bg); padding: 8px 14px; font-size: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.4); border-left: 3px solid var(--edit); }
  .toast.bad { border-left-color: var(--rosso); }
  .toast.ok { border-left-color: var(--ok); }
  .overlay { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.6); display: grid; place-items: center; padding: 20px; }
  .sheet { background: var(--panel); border: 1px solid var(--line-2); width: min(760px, 96vw); max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  .sheet .dhead { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; gap: 12px; }
  .sheet .dhead h3 { margin: 0 0 3px; font-size: 16px; font-weight: 700; }
  .sheet .dhead p { margin: 0; font-size: 12px; color: var(--ink-2); }
  .sheet .dbody { overflow: auto; min-height: 0; }
  .sheet .dfoot { padding: 10px 18px; display: flex; justify-content: space-between; align-items: center; gap: 10px; border-top: 1px solid var(--line); }
  .pickrow { display: flex; align-items: baseline; gap: 10px; width: 100%; padding: 9px 18px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); cursor: pointer; text-align: left; font-family: inherit; font-size: 13px; }
  .pickrow:hover:not(:disabled) { background: var(--panel-2); }
  .pickrow:disabled { opacity: .35; cursor: default; }
  .pickrow .path { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--ink-3); margin-left: auto; white-space: nowrap; }
  .pickrow .added { font-family: "IBM Plex Mono", monospace; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--ok); margin-left: auto; }
  .pickrow.sel { background: var(--panel-2); box-shadow: inset 2px 0 0 var(--edit); }
  .pickrow .note { color: var(--ink-2); font-size: 12px; }
  .shortcuts { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; padding: 12px 18px; font-size: 12px; }
  .shortcuts div { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-bottom: 1px solid var(--line); color: var(--ink-2); }
  .shortcuts div span:last-child { white-space: nowrap; }
  .shortcuts h4 { grid-column: 1 / -1; margin: 10px 0 2px; font-family: "IBM Plex Mono", monospace; font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }
  .chord { position: fixed; right: 14px; bottom: 14px; z-index: 65; background: var(--ink); color: var(--bg); padding: 6px 10px; font-family: "IBM Plex Mono", monospace; font-size: 11px; }

  /* ================= App Builder home ================= */
  .home { display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 0; flex: 1; }
  .home-main { min-width: 0; overflow: auto; padding: 18px 22px; }
  .home-side { border-left: 1px solid var(--line-2); background: var(--panel); overflow: auto; padding: 14px 16px; display: grid; gap: 14px; align-content: start; }
  .home h2 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  .home .sub { color: var(--ink-2); margin: 0 0 16px; font-size: 13px; }
  .hrow { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .hrow input[type="search"] { border: 1px solid var(--line-2); background: var(--bg); color: var(--ink); padding: 6px 10px; font-size: 12px; min-width: 240px; height: 30px; }
  .hrow input:focus { outline: none; border-color: var(--edit); }
  table.rep { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.rep th { text-align: left; font-family: "IBM Plex Mono", monospace; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
  table.rep td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.rep tr.row { cursor: pointer; }
  table.rep tr.row:hover td { background: var(--panel-2); }
  table.rep td.num, table.rep th.num { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; text-align: right; }
  table.rep td .path { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-2); }
  table.rep td .grp { font-family: "IBM Plex Mono", monospace; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 10px; font-size: 12px; }
  .kv dt { color: var(--ink-3); } .kv dd { margin: 0; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
  .sidecard { border: 1px solid var(--line); padding: 12px; display: grid; gap: 8px; }
  .sidecard h4 { margin: 0; font-family: "IBM Plex Mono", monospace; font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }
  .sidecard a, .lnk { color: var(--edit); text-decoration: none; cursor: pointer; background: none; border: 0; padding: 0; font: inherit; text-align: left; }
  .lnk:hover { text-decoration: underline; }

  /* ================= Page Designer ================= */
  .pd { display: grid; grid-template-rows: 44px minmax(0, 1fr); flex: 1; min-height: 0; }
  .pdtb { display: flex; align-items: center; gap: 6px; padding: 0 10px; border-bottom: 1px solid var(--line-2); background: var(--panel); min-width: 0; overflow: hidden; }
  .pdtb .grp { display: inline-flex; align-items: center; gap: 4px; padding-right: 8px; margin-right: 2px; border-right: 1px solid var(--line); height: 30px; }
  .pdtb .grp:last-child { border-right: 0; }
  .pagesel { display: inline-flex; align-items: center; border: 1px solid var(--line-2); height: 30px; }
  .pagesel input { width: 52px; border: 0; border-right: 1px solid var(--line-2); background: var(--bg); color: var(--ink); height: 28px; padding: 0 8px; font-family: "IBM Plex Mono", monospace; font-size: 12px; text-align: center; }
  .pagesel input:focus { outline: none; box-shadow: inset 0 0 0 1px var(--edit); }
  .pagesel .pname { padding: 0 10px; font-size: 12px; font-weight: 600; white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  .pagesel button { border: 0; border-left: 1px solid var(--line-2); background: none; height: 28px; width: 28px; cursor: pointer; color: var(--ink-2); }
  .pagesel button:hover { color: var(--ink); background: var(--panel-2); }
  .lockb { display: inline-flex; align-items: center; gap: 6px; }
  .status { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--ink-3); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-align: right; }
  .status.ok { color: var(--ok); }
  .status.bad { color: var(--rosso); }

  .panes { display: grid; grid-template-columns: var(--lw, 282px) 5px minmax(0, 1fr) 5px var(--rw, 372px); min-height: 0; min-width: 0; }
  .pane { min-height: 0; min-width: 0; display: flex; flex-direction: column; background: var(--panel); position: relative; }
  .split { background: var(--line-2); cursor: col-resize; position: relative; z-index: 3; }
  .split:hover, .split.on { background: var(--edit); }
  .itabs { display: flex; border-bottom: 1px solid var(--line); background: var(--panel-2); }
  .itabs button { flex: 1; border: 0; border-right: 1px solid var(--line); background: none; color: var(--ink-3); cursor: pointer; height: 34px; font-size: 14px; position: relative; }
  .itabs button:last-child { border-right: 0; }
  .itabs button:hover { color: var(--ink); }
  .itabs button.sel { color: var(--ink); box-shadow: inset 0 -2px 0 var(--amber); background: var(--panel); }
  .itabs button .n { position: absolute; top: 4px; right: 6px; font-family: "IBM Plex Mono", monospace; font-size: 8px; color: var(--warn); }
  .tabs { display: flex; border-bottom: 1px solid var(--line); background: var(--panel-2); overflow-x: auto; }
  .tabs button { border: 0; border-right: 1px solid var(--line); background: none; color: var(--ink-3); cursor: pointer; font-family: "IBM Plex Mono", monospace; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; padding: 0 12px; height: 34px; white-space: nowrap; }
  .tabs button.sel { color: var(--ink); box-shadow: inset 0 -2px 0 var(--amber); background: var(--panel); }
  .tabs button:hover { color: var(--ink); }
  .pane-body { flex: 1; overflow: auto; min-height: 0; min-width: 0; }
  .ph { font-family: "IBM Plex Mono", monospace; font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); padding: 12px 12px 6px; }
  .searchrow { padding: 8px 10px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; align-items: center; }
  .searchrow input { flex: 1; min-width: 0; border: 1px solid var(--line-2); background: var(--bg); color: var(--ink); padding: 5px 8px; font-size: 12px; height: 28px; }
  .searchrow input:focus { outline: none; border-color: var(--edit); }
  .empty { padding: 20px 14px; color: var(--ink-3); font-size: 12px; line-height: 1.55; }

  /* tree */
  .tree { list-style: none; margin: 0; padding: 4px 6px 12px; }
  .tree li { margin: 0; }
  .tree .sub { padding-left: 16px; list-style: none; margin: 0; border-left: 1px dotted var(--line-2); margin-left: 12px; }
  .tnode { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border: 1px solid transparent; cursor: pointer; font-size: 12px; color: var(--ink-2); user-select: none; }
  .tnode:hover { background: var(--panel-2); color: var(--ink); }
  .tnode.sel { background: var(--edit-dim); border-color: var(--edit); color: var(--ink); }
  .tnode .tw { width: 12px; text-align: center; color: var(--ink-3); font-size: 9px; flex: none; }
  .tnode .ti { width: 14px; text-align: center; color: var(--ink-3); font-size: 11px; flex: none; }
  .tnode .tn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tnode .tt { font-family: "IBM Plex Mono", monospace; font-size: 8px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
  .tnode.off .tn { text-decoration: line-through; color: var(--ink-3); }
  .tnode.locked .tn { color: var(--ink-3); }
  .tnode .em { width: 7px; height: 7px; border-radius: 50%; background: var(--rosso); flex: none; }
  .tnode .em.warn { background: var(--warn); }
  .tnode.tdrag { opacity: .4; }
  .tnode.tbefore { box-shadow: inset 0 2px 0 var(--edit); }
  .tnode.grp { color: var(--ink); font-weight: 600; }
  .tnode.pos { font-family: "IBM Plex Mono", monospace; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }

  /* centre */
  .centre { display: grid; grid-template-rows: 34px minmax(0, 1fr) auto; min-height: 0; min-width: 0; background: var(--desk); position: relative; }
  .ctab { min-height: 0; min-width: 0; overflow: auto; display: none; }
  .ctab.sel { display: block; }
  .lay { padding: 14px 16px 24px; min-width: 0; }
  .pagebox { border: 1px solid var(--line-2); background: var(--panel); min-width: 0; }
  .pagebox > .pbcap { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel-2); cursor: pointer; }
  .pagebox > .pbcap:hover { background: var(--panel-3); }
  .pagebox.sel > .pbcap { box-shadow: inset 0 0 0 2px var(--edit); }
  .pbcap .cap { color: var(--ink-2); }
  .pbcap .cap b { color: var(--ink); font-weight: 600; }
  .pos { margin: 10px 12px; border: 1px dashed var(--line-2); min-width: 0; position: relative; }
  .pos.locked { border-style: solid; background: var(--panel-2); }
  .pos .pcap { display: flex; align-items: center; gap: 8px; padding: 5px 10px; font-family: "IBM Plex Mono", monospace; font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); cursor: default; user-select: none; }
  .pos .pcap .cnt { color: var(--ink-3); margin-left: 4px; letter-spacing: 0; }
  .pos .pcap .lk { margin-left: auto; color: var(--ink-3); font-size: 10px; letter-spacing: .06em; display: inline-flex; gap: 8px; align-items: center; }
  .pos .pcap .lk button { border: 1px solid var(--line-2); background: none; color: var(--edit); cursor: pointer; font-family: inherit; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 7px; }
  .pos .pcap .lk button:hover { background: var(--edit-dim); }
  .pos.empty-pos { opacity: .7; }
  .pos.empty-pos .pcap { padding: 7px 10px; }
  .hide-empty .pos.empty-pos:not(.dropping) { display: none; }
  .pos .pbody { padding: 0 8px 8px; min-width: 0; }
  .pos.locked .pbody { padding: 0 10px 8px; }
  .shared-tile { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border: 1px solid var(--line-2); background: var(--panel); font-size: 12px; color: var(--ink-2); min-width: 0; cursor: pointer; }
  .shared-tile:hover { border-color: var(--ink-2); }
  .shared-tile.sel { border-color: var(--edit); box-shadow: 0 0 0 1px var(--edit); }
  .shared-tile .sti { color: var(--ink-3); }
  .shared-tile .stn { font-weight: 600; color: var(--ink); }
  .shared-tile .sts { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--ink-3); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .shared-tile .lock { margin-left: auto; font-family: "IBM Plex Mono", monospace; font-size: 8px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); border: 1px solid var(--line-2); padding: 2px 6px; white-space: nowrap; }
  .ruler { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; padding: 0 8px; margin-top: 2px; }
  .ruler span { font-family: "IBM Plex Mono", monospace; font-size: 8px; color: var(--ink-3); text-align: center; border-bottom: 1px solid var(--line-2); padding-bottom: 2px; }
  .bodygrid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; padding: 6px 8px 0; grid-auto-rows: auto; min-width: 0; }
  .bodygrid > .rt { min-height: 64px; }
  .show-cols .bodygrid { background: repeating-linear-gradient(90deg, transparent 0 calc((100% - 44px) / 12), var(--line) calc((100% - 44px) / 12) calc((100% - 44px) / 12 + 4px)); background-origin: content-box; }
  .rt { border: 1px solid var(--line-2); background: var(--bg); min-width: 0; display: flex; flex-direction: column; position: relative; cursor: pointer; }
  .rt:hover { border-color: var(--ink-3); }
  .rt.sel { border-color: var(--edit); box-shadow: 0 0 0 1px var(--edit); }
  .rt.off { opacity: .55; border-style: dashed; }
  .rt.rdrag { opacity: .35; }
  .rth { display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-bottom: 1px solid var(--line); background: var(--panel-2); cursor: grab; min-width: 0; }
  .rt.sel .rth { background: var(--edit-dim); }
  .rth .ri { color: var(--ink-3); font-size: 11px; flex: none; }
  .rth .rn { font-weight: 600; font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
  .rth .rk { font-family: "IBM Plex Mono", monospace; font-size: 8px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
  .rth .rseq { margin-left: auto; font-family: "IBM Plex Mono", monospace; font-size: 9px; color: var(--ink-3); white-space: nowrap; }
  .rth .em { width: 8px; height: 8px; border-radius: 50%; background: var(--rosso); flex: none; }
  .rth .em.warn { background: var(--warn); }
  .rtb { padding: 6px 8px 8px; display: grid; gap: 6px; min-width: 0; }
  .slot { border: 1px dashed var(--line-2); padding: 4px 8px 6px; min-width: 0; }
  .slot .scap { font-family: "IBM Plex Mono", monospace; font-size: 8px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); display: flex; justify-content: space-between; gap: 8px; }
  .slot .sbody { font-size: 11px; color: var(--ink-2); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot .sbody.wrap { white-space: normal; }
  .slot .sbody .tok { background: var(--panel-2); border-bottom: 1px solid var(--amber); padding: 0 3px; }
  .slot.btns .sbody, .slot.items .sbody { display: flex; flex-wrap: wrap; gap: 4px; white-space: normal; }
  .bpill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--panel); padding: 3px 8px; font-family: "IBM Plex Mono", monospace; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); cursor: pointer; }
  .bpill:hover { border-color: var(--ink-2); }
  .bpill.sel { border-color: var(--edit); background: var(--edit-dim); }
  .bpill .bt { color: var(--ink-3); letter-spacing: 0; text-transform: none; font-size: 9px; }
  .itile { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); border-left: 3px solid var(--ok); background: var(--panel); padding: 3px 8px; font-family: "IBM Plex Mono", monospace; font-size: 9px; color: var(--ink); cursor: pointer; }
  .itile:hover { border-color: var(--ink-2); }
  .itile.sel { border-color: var(--edit); background: var(--edit-dim); }
  .itile .it { color: var(--ink-3); }
  .drop { display: none; border: 1px dashed var(--drop); background: var(--drop-bg); color: var(--drop); font-family: "IBM Plex Mono", monospace; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; padding: 8px 10px; text-align: center; min-height: 34px; align-items: center; justify-content: center; }
  .dropping .drop { display: flex; }
  .drop.over { background: var(--drop); color: #111; }
  .drop.inline { min-height: 22px; padding: 2px 6px; font-size: 8px; }
  .lay .stack { display: grid; gap: 6px; padding: 6px 8px 0; }

  /* component view */
  .cv { padding: 14px 16px 24px; display: grid; gap: 18px; }
  .cv h4 { margin: 0 0 6px; font-family: "IBM Plex Mono", monospace; font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }
  .cv table.rep { background: var(--panel); border: 1px solid var(--line); }
  /* messages */
  .msgs { padding: 8px 0 24px; }
  .msg { display: flex; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--ink-2); cursor: pointer; }
  .msg:hover { background: var(--panel-2); }
  .msg .lv { font-family: "IBM Plex Mono", monospace; font-size: 8px; letter-spacing: .12em; text-transform: uppercase; width: 52px; flex: none; padding-top: 3px; }
  .msg .lv.err { color: var(--rosso); } .msg .lv.warn { color: var(--warn); } .msg .lv.info { color: var(--ok); }
  .msg .mt b { color: var(--ink); font-weight: 600; }
  .msg .mt .where { display: block; font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--ink-3); margin-top: 2px; }
  /* page search + help */
  .psearch { padding: 12px 16px; display: grid; gap: 10px; }
  .psearch input { border: 1px solid var(--line-2); background: var(--bg); color: var(--ink); padding: 7px 10px; font-size: 13px; }
  .psearch input:focus { outline: none; border-color: var(--edit); }
  .sres { border: 1px solid var(--line); background: var(--panel); cursor: pointer; padding: 8px 12px; font-size: 12px; }
  .sres:hover { border-color: var(--edit); }
  .sres .sw { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--ink-3); }
  .sres mark { background: var(--drop-bg); color: var(--ink); }
  .helpv { padding: 16px 20px 24px; max-width: 720px; font-size: 13px; color: var(--ink-2); line-height: 1.6; }
  .helpv h3 { margin: 0 0 6px; color: var(--ink); font-size: 16px; }
  .helpv h4 { margin: 16px 0 4px; color: var(--ink); font-size: 13px; }
  .helpv .cap { display: block; margin-bottom: 8px; }
  .helpv p { margin: 0 0 10px; }

  /* gallery */
  .gallery { border-top: 1px solid var(--line-2); background: var(--panel); min-width: 0; }
  .gallery .gtabs { display: flex; align-items: center; gap: 0; border-bottom: 1px solid var(--line); }
  .gallery .gtabs button { border: 0; border-right: 1px solid var(--line); background: none; color: var(--ink-3); cursor: pointer; font-family: "IBM Plex Mono", monospace; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; padding: 0 12px; height: 28px; }
  .gallery .gtabs button.sel { color: var(--ink); box-shadow: inset 0 -2px 0 var(--amber); }
  .gallery .gtabs .hint { margin-left: auto; padding-right: 12px; font-family: "IBM Plex Mono", monospace; font-size: 9px; color: var(--ink-3); letter-spacing: .06em; }
  .gitems { display: flex; gap: 8px; overflow-x: auto; padding: 8px 12px 10px; }
  .gitem { flex: none; width: 112px; border: 1px solid var(--line-2); background: var(--bg); cursor: grab; padding: 7px 8px; display: grid; gap: 5px; }
  .gitem:hover { border-color: var(--edit); }
  .gitem .gi { font-size: 14px; color: var(--ink-2); line-height: 1; }
  .gitem .gn { font-size: 11px; font-weight: 600; color: var(--ink); line-height: 1.2; }
  .gitem .gd { font-size: 10px; color: var(--ink-3); line-height: 1.3; }

  /* ================= property editor ================= */
  .pehead { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .pehead input { flex: 1; min-width: 0; border: 1px solid var(--line-2); background: var(--bg); color: var(--ink); padding: 5px 8px; font-size: 12px; height: 28px; }
  .pehead input:focus { outline: none; border-color: var(--edit); }
  .pehead .ib { width: 28px; height: 28px; font-size: 12px; }
  .peid { padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; font-size: 12px; background: var(--panel-2); min-width: 0; }
  .peid .pt { font-family: "IBM Plex Mono", monospace; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
  .peid .pn { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pe .pgroup { border-bottom: 1px solid var(--line); }
  .pe .pgh { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; cursor: pointer; font-family: "IBM Plex Mono", monospace; font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); background: var(--panel-2); user-select: none; }
  .pe .pgh:hover { color: var(--ink); }
  .pe .pgh .car { color: var(--ink-3); }
  .pe .pgb { padding: 8px 12px 12px; display: grid; gap: 9px; }
  .pe .pgroup.closed .pgb { display: none; }
  .pe .pgroup.closed .pgh .car { transform: rotate(-90deg); }
  .prop { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px; align-items: start; }
  .prop > label { font-size: 11px; color: var(--ink-2); padding-top: 5px; cursor: help; line-height: 1.3; }
  .prop > label:hover { color: var(--edit); }
  .prop.focus > label { color: var(--edit); }
  .prop .pv { min-width: 0; display: grid; gap: 6px; }
  .prop input[type="text"], .prop input[type="number"], .prop input[type="date"], .prop textarea, .prop select { width: 100%; border: 1px solid var(--line-2); background: var(--bg); color: var(--ink); padding: 5px 8px; font-family: inherit; font-size: 12px; }
  .prop textarea { font-family: "IBM Plex Mono", monospace; font-size: 11px; min-height: 84px; resize: vertical; }
  .prop input:focus, .prop textarea:focus, .prop select:focus { outline: none; border-color: var(--edit); }
  .prop .ro { font-size: 12px; color: var(--ink); padding-top: 5px; }
  .prop .ro.dim { color: var(--ink-3); }
  .pnote { font-family: "IBM Plex Mono", monospace; font-size: 9px; color: var(--ink-3); letter-spacing: .03em; line-height: 1.45; }
  .pnote.bad { color: var(--rosso); }
  .mini { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 2px; border: 1px solid var(--line-2); padding: 4px; background: var(--bg); }
  .mini .mc { min-height: 16px; background: var(--panel-2); border: 1px solid var(--line); font-family: "IBM Plex Mono", monospace; font-size: 7px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); padding: 1px 3px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .mini .mc.me { background: var(--edit-dim); border-color: var(--edit); color: var(--ink); }
  .ptiles { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; }
  .ptile { aspect-ratio: 4/3; border: 1px solid var(--line-2); cursor: pointer; position: relative; padding: 0; overflow: hidden; background-size: cover; background-position: center; }
  .ptile.sel { outline: 2px solid var(--edit); outline-offset: 1px; }
  .ptile .pcap { position: absolute; left: 4px; right: 4px; bottom: 4px; font-family: "IBM Plex Mono", monospace; font-size: 7px; letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.9); text-align: left; text-shadow: 0 1px 2px rgba(0,0,0,.7); }
  .ptile.none, .ptile.upload { background: var(--bg); border-style: dashed; display: grid; place-items: center; font-family: "IBM Plex Mono", monospace; font-size: 8px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
  .ptile.upload { border-color: var(--edit); color: var(--edit); }
  .colorrow { display: flex; align-items: center; gap: 8px; }
  .prop input[type="color"], .colorrow input[type="color"] { width: 36px; height: 24px; padding: 0; border: 1px solid var(--line-2); background: none; }
  .contrast { font-family: "IBM Plex Mono", monospace; font-size: 10px; }
  .contrast.bad { color: var(--rosso); } .contrast.good { color: var(--ok); }
  .pehelp { border-top: 1px solid var(--line-2); padding: 10px 12px; font-size: 12px; color: var(--ink-2); max-height: 34%; overflow: auto; background: var(--panel-2); }
  .pehelp b { color: var(--ink); }
  .multi { padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--ink-2); background: var(--panel-2); }

  /* ================= Save and Run ================= */
  .runview { display: grid; grid-template-rows: 36px 34px auto minmax(0, 1fr) auto; flex: 1; min-height: 0; }
  .brow { display: flex; align-items: center; gap: 8px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line-2); }
  .brow .url { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 26px; border: 1px solid var(--line-2); border-radius: 13px; padding: 0 12px; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-2); background: var(--bg); overflow: hidden; white-space: nowrap; }
  .brow .url b { color: var(--ink); font-weight: 500; }
  .devbar { display: flex; align-items: center; gap: 8px; padding: 0 10px; background: #282828; color: #c7c7c7; border-bottom: 1px solid #3c3c3c; font-family: system-ui, "Segoe UI", sans-serif; font-size: 12px; min-width: 0; overflow: hidden; }
  :root[data-theme="light"] .devbar { background: #f1f3f4; color: #333; border-bottom-color: #cacdd1; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .devbar { background: #f1f3f4; color: #333; border-bottom-color: #cacdd1; } }
  .devbar .lbl { color: inherit; opacity: .8; }
  .dsel { border: 1px solid transparent; background: none; color: inherit; cursor: pointer; padding: 3px 6px; font: inherit; display: inline-flex; align-items: center; gap: 6px; border-radius: 2px; white-space: nowrap; }
  .dsel:hover { background: rgba(127,127,127,.18); }
  .dsel.on { border-color: #ff9a2e; }
  .dsel .car { font-size: 9px; opacity: .7; }
  .dsel .cur { color: #ff9a2e; }
  .dnum { width: 46px; border: 1px solid transparent; background: none; color: inherit; font: inherit; text-align: center; padding: 3px 2px; border-radius: 2px; }
  .dnum:hover, .dnum:focus { border-color: rgba(127,127,127,.4); background: rgba(127,127,127,.12); outline: none; }
  .dnum:disabled { opacity: .5; }
  .dx { opacity: .6; }
  .devbar .ib { color: inherit; width: 26px; height: 26px; }
  .devbar .ib:hover { background: rgba(127,127,127,.18); border-color: transparent; color: inherit; }
  .mqbar { position: relative; height: 0; overflow: hidden; background: var(--stage); border-bottom: 1px solid var(--line); }
  .mqbar.on { height: 22px; }
  .mq { position: absolute; top: 4px; height: 14px; border-radius: 2px; opacity: .8; cursor: pointer; font-family: "IBM Plex Mono", monospace; font-size: 8px; line-height: 14px; padding: 0 6px; color: #fff; white-space: nowrap; overflow: hidden; }
  .mq:hover { opacity: 1; }
  .stage { position: relative; overflow: auto; background: var(--stage); min-height: 0; min-width: 0; }
  .stage.rulers { padding-top: 16px; padding-left: 16px; }
  .rul { position: absolute; background: var(--panel-2); color: var(--ink-3); font-family: "IBM Plex Mono", monospace; font-size: 7px; display: none; z-index: 3; }
  .stage.rulers .rul { display: block; }
  .rul.top { left: 16px; top: 0; height: 16px; right: 0; background-image: repeating-linear-gradient(90deg, var(--line-2) 0 1px, transparent 1px 100px); }
  .rul.left { left: 0; top: 16px; width: 16px; bottom: 0; background-image: repeating-linear-gradient(180deg, var(--line-2) 0 1px, transparent 1px 100px); }
  .vpwrap { position: relative; margin: 0 auto; }
  .vpscale { transform-origin: top left; position: relative; }
  .devframe { position: absolute; inset: -12px -10px -14px -10px; border: 2px solid #3a3d44; border-radius: 30px; pointer-events: none; display: none; box-shadow: 0 0 0 4px #14161a; }
  .devframe .notch { position: absolute; left: 50%; top: 6px; width: 80px; height: 14px; transform: translateX(-50%); background: #14161a; border-radius: 8px; }
  .framed .devframe { display: block; }
  .vp { position: relative; overflow: auto; background: var(--bg); color: var(--ink); outline: 1px solid #000; }
  .rz { position: absolute; z-index: 5; background: transparent; }
  .rz.e { top: 0; bottom: 0; width: 10px; cursor: ew-resize; }
  .rz.s { left: 0; right: 0; height: 10px; cursor: ns-resize; }
  .rz.e::after, .rz.s::after { content: ""; position: absolute; background: #777; border-radius: 2px; }
  .rz.e::after { top: 50%; left: 3px; width: 4px; height: 26px; transform: translateY(-50%); }
  .rz.s::after { left: 50%; top: 3px; height: 4px; width: 26px; transform: translateX(-50%); }
  .devtb { display: flex; align-items: center; justify-content: center; gap: 0; padding: 4px 0 6px; background: var(--stage); }
  .devtb .bar { display: inline-flex; align-items: stretch; background: #1d1f24; color: #d7d9de; border: 1px solid #3a3d44; border-radius: 6px; box-shadow: 0 8px 30px rgba(0,0,0,.5); overflow: hidden; }
  .devtb .bar button { border: 0; border-right: 1px solid #2c2f36; background: none; color: inherit; cursor: pointer; padding: 0 12px; height: 34px; font-size: 12px; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .devtb .bar button:last-child { border-right: 0; }
  .devtb .bar button:hover { background: #2a2d34; }
  .devtb .bar button.on { color: #7cc0ff; background: #1b2a3d; }
  .devtb .bar button .i { font-size: 13px; color: #9aa0a8; }
  .devtb .bar button.on .i { color: #7cc0ff; }
  .devtb.icons .bar button .t { display: none; }
  .debugp { border-top: 1px solid var(--line-2); background: var(--panel); max-height: 32vh; overflow: auto; font-family: "IBM Plex Mono", monospace; font-size: 11px; }
  .debugp .dl { display: flex; gap: 12px; padding: 4px 12px; border-bottom: 1px solid var(--line); color: var(--ink-2); }
  .debugp .dl .t { color: var(--ink-3); width: 64px; flex: none; }
  .debugp .dl .lv { width: 44px; flex: none; color: var(--ok); }
  .debugp .dl .lv.da { color: var(--edit); } .debugp .dl .lv.err { color: var(--rosso); }
  .debugp .dh { display: flex; justify-content: space-between; padding: 6px 12px; border-bottom: 1px solid var(--line); color: var(--ink-3); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; }
  .qe [data-rid], .qe [data-bid], .qe [data-iid], .qe .topbar, .qe .mobilebar, .qe .sitefoot { outline: 1px dashed var(--edit); outline-offset: -1px; cursor: crosshair; }
  .qe [data-rid]:hover, .qe [data-bid]:hover, .qe [data-iid]:hover, .qe .topbar:hover, .qe .mobilebar:hover, .qe .sitefoot:hover { outline: 2px solid var(--edit); background-color: rgba(59,157,255,.08); }
  .qebanner { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); z-index: 9; background: var(--edit); color: #fff; padding: 5px 12px; font-size: 12px; border-radius: 3px; pointer-events: none; }
  .colsov { position: absolute; inset: 0; pointer-events: none; z-index: 8; }
  .colsov .grid { position: absolute; left: 18px; right: 18px; top: 0; bottom: 0; display: grid; grid-template-columns: repeat(12, 1fr); gap: 1px; }
  .colsov .grid i { background: rgba(255,0,110,.09); border-left: 1px solid rgba(255,0,110,.35); border-right: 1px solid rgba(255,0,110,.35); }
  .lmk { position: absolute; z-index: 9; font-family: "IBM Plex Mono", monospace; font-size: 8px; letter-spacing: .12em; text-transform: uppercase; background: #6a3df5; color: #fff; padding: 2px 6px; pointer-events: none; }
  .roller { position: absolute; right: 12px; top: 12px; z-index: 12; width: 300px; background: var(--panel); border: 1px solid var(--line-2); box-shadow: 0 20px 50px rgba(0,0,0,.5); display: grid; gap: 0; }
  .roller .rh { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--line); font-weight: 600; }
  .roller .rb { padding: 10px 12px; display: grid; gap: 10px; }
  .sessp { padding: 12px 18px; display: grid; gap: 6px; }

  /* ================= the site frame (run view) ================= */
  .frame { width: 100%; background: var(--bg); color: var(--ink); position: relative; margin: 0; min-height: 100%; }
  .frame[data-site-theme="midnight"]  { --bg:#121215; --panel:#1b1b21; --panel-2:#22222a; --line:#2a2a33; --line-2:#3a3a45; --ink:#e4e4e8; --ink-2:#a4a4ad; --ink-3:#74747e; --amber:#ffb400; }
  .frame[data-site-theme="carbon"]    { --bg:#060a12; --panel:#111721; --panel-2:#172031; --line:#1e2838; --line-2:#2c3a4f; --ink:#f0f4f9; --ink-2:#a3adbb; --ink-3:#6f7a8a; --amber:#ffb400; }
