name: notify cron

on:
  schedule:
    # Every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Required so the workflow can read the CRON_SECRET from repo secrets
permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/cron/notify (sessions)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          AUTH_HEADER=""
          if [ -n "$CRON_SECRET" ]; then
            AUTH_HEADER="Authorization: Bearer $CRON_SECRET"
          fi
          STATUS=$(curl -sS -o /tmp/notify.json -w "%{http_code}" \
            -H "$AUTH_HEADER" \
            https://paddock-tracker.com/api/cron/notify)
          echo "Status: $STATUS"
          cat /tmp/notify.json
          echo ""
          test "$STATUS" = "200"

# News moved to its own workflow (.github/workflows/news.yml) on an offset
# schedule so its pushes don't land in the same minute as the session/results
# reminders this job sends (operator 2026-07-09).
