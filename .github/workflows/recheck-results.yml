name: recheck results

on:
  schedule:
    # Weekly, Tuesday 06:20 UTC — after the weekend's stewards' documents and
    # points corrections have typically landed. Report-only: the route diffs
    # current upstream results against its own last recorded copy and never
    # mutates the serving caches.
    - cron: '20 6 * * 2'
  workflow_dispatch:

# Required so the workflow can read CRON_SECRET from repo secrets.
permissions:
  contents: read

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/cron/recheck-results
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          AUTH_HEADER=""
          if [ -n "$CRON_SECRET" ]; then
            AUTH_HEADER="Authorization: Bearer $CRON_SECRET"
          fi
          STATUS=$(curl -sS -o /tmp/recheck.json -w "%{http_code}" \
            -H "$AUTH_HEADER" \
            https://paddock-tracker.com/api/cron/recheck-results)
          echo "Status: $STATUS"
          cat /tmp/recheck.json
          echo ""
          test "$STATUS" = "200"
          # Fail the job when upstream results changed for an already-completed
          # round (late penalty / correction) so GitHub surfaces the alert. The
          # body above lists exactly which races and drivers moved; caches are
          # NOT auto-corrected — review, then curate an override or purge.
          DIFFS=$(jq -r '.differences // 0' /tmp/recheck.json)
          echo "Differences: $DIFFS"
          test "$DIFFS" = "0"
