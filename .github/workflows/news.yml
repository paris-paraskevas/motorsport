name: news cron

on:
  schedule:
    # Every 15 minutes, offset ~7 min from the notify tick (*/15) so news pushes
    # don't pile into the same minute as session / results / analysis reminders
    # (operator 2026-07-09: "spam all in one minute"). Split out of notify.yml.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

# Required so the workflow can read the CRON_SECRET from repo secrets
permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/cron/news (articles)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          AUTH_HEADER=""
          if [ -n "$CRON_SECRET" ]; then
            AUTH_HEADER="Authorization: Bearer $CRON_SECRET"
          fi
          STATUS=$(curl -sS -o /tmp/news.json -w "%{http_code}" \
            -H "$AUTH_HEADER" \
            https://paddock-tracker.com/api/cron/news)
          echo "Status: $STATUS"
          cat /tmp/news.json
          echo ""
          # 503 (kv not configured) is acceptable while KV is being provisioned
          test "$STATUS" = "200" -o "$STATUS" = "503"
