name: warm sessions

on:
  schedule:
    # Every 10 minutes — captures recently-ended sessions' classifications into
    # KV so results surface sooner after a session ends (was */30). The route
    # self-gates (only sessions ended within the lookback window and >=10 min
    # old), so idle ticks no-op — safe to run densely. A miss (classification
    # not yet published) is never cached, so the next tick simply retries;
    # per-run upstream load is capped inside the route.
    - cron: '*/10 * * * *'
  workflow_dispatch:

# Required so the workflow can read CRON_SECRET from repo secrets.
permissions:
  contents: read

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/cron/warm-sessions
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          AUTH_HEADER=""
          if [ -n "$CRON_SECRET" ]; then
            AUTH_HEADER="Authorization: Bearer $CRON_SECRET"
          fi
          STATUS=$(curl -sS -o /tmp/warm-sessions.json -w "%{http_code}" \
            -H "$AUTH_HEADER" \
            https://paddock-tracker.com/api/cron/warm-sessions)
          echo "Status: $STATUS"
          cat /tmp/warm-sessions.json
          echo ""
          test "$STATUS" = "200"
